<!DOCTYPE html>
<html>
<head>
<title>Cart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <h2>Cart</h2>
  <a href="products.html">Back</a>
</nav>

<div class="container" id="cart"></div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let div = document.getElementById("cart");

let total = 0;

cart.forEach(item => {
  total += item.price;
  div.innerHTML += `<p>${item.name} - ${item.price} RWF</p>`;
});

div.innerHTML += `<h3>Total: ${total} RWF</h3>`;
</script>

</body>
</html>
